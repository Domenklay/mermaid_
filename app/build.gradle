plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tidemoon.daughter'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tidemoon.daughter'
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName '0.7.1'
    }

    signingConfigs {
        debug {
            // Stable development key restored by GitHub Actions.
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
