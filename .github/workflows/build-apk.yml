name: Build Daughter of Two Worlds APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate chapter II JavaScript
        run: |
          node --check story/chapter2_v07.js
          node --check story/ui_fix_v071.js

      - name: Assemble offline story source
        run: |
          mkdir -p app/src/main/assets
          cat story/parts/part-*.txt > app/src/main/assets/index.html
          echo "e8d0b42778370848295bdbadf3ab79e48ea59ad9741551b0c4079116aa51cb74  app/src/main/assets/index.html" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/index.html')
          old = p.read_text(encoding='utf-8')
          addon = Path('story/chapter2_v07.js').read_text(encoding='utf-8')
          fix = Path('story/ui_fix_v071.js').read_text(encoding='utf-8')
          marker = 'settingsLoad();load();showCover();'
          assert old.count(marker) == 1, "0.6 bootstrap marker not found uniquely"
          p.write_text(old.replace(marker, addon + '\n' + fix + '\n' + marker).replace(
              '<title>Дочь двух миров — Песнь прилива</title>',
              '<title>Дочь двух миров — главы I и II</title>'),
              encoding='utf-8')
          assert p.stat().st_size > 5900000
          PY

      - name: Install Android 35 using runner SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMGR"
          echo "Using $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: daughter-two-worlds-development-signing-v1

      - name: Initialize development signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storetype JKS -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Doch_dvuh_mirov_v071_debug_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
